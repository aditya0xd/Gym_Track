# Manual production deploy to Vercel via webhook.
#
# Run: GitHub → Actions → Production → Run workflow
#
# Deploys via Vercel Deploy Hook (no token required).
# Hook URL stored in GitHub environment secrets for safety.

name: Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: main
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-deployed-url.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Trigger Vercel deployment via webhook
        id: deploy
        run: |
          response=$(curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ inputs.ref }}"}' \
            -w "\n%{http_code}")
          
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          
          echo "response=$body" >> "$GITHUB_OUTPUT"
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"
          
          if [ "$http_code" -ne 200 ]; then
            echo "Deployment hook failed with status $http_code"
            echo "Response: $body"
            exit 1
          fi
          
          echo "Deployment triggered successfully"
